name: Phase quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix frontend
      - run: cp .env.example .env
      - run: docker compose --profile oidc-dev up -d --wait
      - run: uv run python scripts/init_storage.py
      - name: Create isolated migration test database
        run: docker compose exec -T postgres createdb -U operations operations_test
      - name: Create isolated browser test database
        run: docker compose exec -T postgres createdb -U operations operations_browser_test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m 'not e2e'
        env:
          IOP_TEST_DATABASE_URL: postgresql+psycopg://operations:operations_dev@127.0.0.1:55432/operations_test
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e
        env:
          IOP_BROWSER_DATABASE_URL: postgresql+psycopg://operations:operations_dev@127.0.0.1:55432/operations_browser_test
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python scripts/export_openapi.py --check
      - if: always()
        run: docker compose --profile oidc-dev down
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api-schema.d.ts
      - run: npm run build
